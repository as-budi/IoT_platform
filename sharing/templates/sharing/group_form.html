{% extends "base.html" %}

{% block title %}{% if group %}Edit{% else %}New{% endif %} group · IoT Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <h1 class="h3 mb-3">{% if group %}Edit {{ group.name }}{% else %}New sharing group{% endif %}</h1>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {% include "includes/form_fields.html" %}
          <button type="submit" class="btn btn-primary">Save</button>
          <a class="btn btn-link" href="{% if group %}{% url 'sharing:group_detail' group.pk %}{% else %}{% url 'sharing:group_list' %}{% endif %}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
