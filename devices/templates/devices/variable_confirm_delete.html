{% extends "base.html" %}

{% block title %}Delete variable · IoT Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4">Delete variable {{ variable.display_name }}?</h1>
        <p class="text-muted">
          All telemetry data for this variable will be deleted too. This action cannot be undone.
        </p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Yes, delete</button>
          <a class="btn btn-link" href="{% url 'devices:variable_detail' device.pk variable.pk %}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
