{% comment %}
  Saklar pembaruan langsung. Dipakai halaman device dan halaman variabel.
  Perlu tiga variabel dari view: ws_path, updates_url, dan data_version.
  Logikanya ada di static/js/auto_refresh.js (dimuat oleh base.html):
  WebSocket bila tersedia, polling bila tidak.
{% endcomment %}
<div id="auto-refresh" class="d-flex flex-wrap align-items-center gap-2 small mb-3"
     data-ws-path="{{ ws_path }}" data-url="{{ updates_url }}" data-version="{{ data_version }}" data-interval="5">
  <div class="form-check form-switch mb-0">
    <input class="form-check-input" type="checkbox" role="switch" id="auto-refresh-toggle" checked>
    <label class="form-check-label" for="auto-refresh-toggle">Live updates</label>
  </div>
  <span class="text-muted" data-status aria-live="polite">Connecting…</span>
  <button type="button" class="btn btn-sm btn-outline-primary py-0" data-reload hidden>Reload now</button>
</div>
