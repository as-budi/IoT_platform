{% comment %}Lokasi sebagai pill (ikon pin + nama). Butuh `location`; `link` = boleh membuka halaman lokasi.{% endcomment %}
{% if link %}<a class="entity-pill entity-location" href="{% url 'devices:location_detail' location.pk %}" title="{{ location.name }}">{% else %}<span class="entity-pill entity-location" title="{{ location.name }}">{% endif %}{% include "includes/icon.html" with name="location" %}<span class="entity-text">{{ location.name }}</span>{% if link %}</a>{% else %}</span>{% endif %}
