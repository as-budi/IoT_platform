{% extends "base.html" %}

{% block title %}Delete location · IoT Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4">Delete location {{ location.name }}?</h1>
        <p class="text-muted">
          A location that is still used by a device cannot be deleted. Move those devices first.
        </p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Yes, delete</button>
          <a class="btn btn-link" href="{% url 'devices:location_detail' location.pk %}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
