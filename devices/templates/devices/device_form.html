{% extends "base.html" %}

{% block title %}{% if device %}Edit{% else %}Add{% endif %} device · IoT Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <h1 class="h3 mb-3">{% if device %}Edit {{ device.name }}{% else %}Add device{% endif %}</h1>
    <div class="card shadow-sm">
      <div class="card-body">
        <form method="post">
          {% csrf_token %}
          {% include "includes/form_fields.html" %}
          <button type="submit" class="btn btn-primary">Save</button>
          <a class="btn btn-link" href="{% if device %}{% url 'devices:detail' device.pk %}{% else %}{% url 'devices:list' %}{% endif %}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
