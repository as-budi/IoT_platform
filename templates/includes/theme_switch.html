{# Saklar tema Light / Dark / Auto. Logikanya di static/js/theme.js. #}
<div class="theme-switch btn-group btn-group-sm" role="group" aria-label="Color mode">
  <button type="button" class="btn" data-theme-choice="light" title="Light mode" aria-label="Light mode">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
    </svg>
  </button>
  <button type="button" class="btn" data-theme-choice="dark" title="Dark mode" aria-label="Dark mode">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
    </svg>
  </button>
  <button type="button" class="btn" data-theme-choice="auto" title="Follow system setting" aria-label="Follow system setting">
    <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
    </svg>
  </button>
</div>
