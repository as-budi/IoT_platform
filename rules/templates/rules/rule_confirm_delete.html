{% extends "base.html" %}

{% block title %}Delete rule · IoT Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card shadow-sm">
      <div class="card-body">
        <h1 class="h4">Delete rule {{ rule.name }}?</h1>
        <p class="text-muted">Its execution log is deleted too. Alarms it raised are kept, without the link to this rule.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Yes, delete</button>
          <a class="btn btn-link" href="{% url 'rules:detail' rule.pk %}">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
