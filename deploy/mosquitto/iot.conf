# /etc/mosquitto/conf.d/iot.conf — broker MQTT milik platform (Mosquitto 2.x).
# Ganti iot.contoh.my.id dengan domain Anda.

# false = akun & ACL di bawah berlaku untuk SEMUA listener.
per_listener_settings false

# Tanpa akun = ditolak. Akun dibuat oleh `manage.py mqtt_accounts` (timer systemd) di
# /srv/iot/mosquitto, lalu disalin ke sini dengan pemilik mosquitto oleh iot-mqtt-reload.service.
allow_anonymous false
password_file /etc/mosquitto/iot/passwd
acl_file /etc/mosquitto/iot/acl

# 1) Hanya untuk mqtt_bridge di server ini: localhost, tanpa TLS.
#    Port 1883 TIDAK dibuka di firewall (panel penyedia maupun ufw).
listener 1883 127.0.0.1

# 2) Untuk device dari internet: MQTT di atas TLS (port 8883).
#    Sertifikat Let's Encrypt yang sama dengan situs web, disalin oleh
#    /etc/letsencrypt/renewal-hooks/deploy/mosquitto.sh setiap kali diperbarui.
listener 8883
certfile /etc/mosquitto/certs/fullchain.pem
keyfile /etc/mosquitto/certs/privkey.pem
tls_version tlsv1.2

# 3) Untuk browser (tahap 21): MQTT over WebSocket, hanya di localhost.
#    Nginx meneruskan wss://iot.contoh.my.id/mqtt ke sini (TLS di Nginx, port 443),
#    jadi port 9001 TIDAK dibuka di firewall. Akun & ACL sama dengan listener lain.
listener 9001 127.0.0.1
protocol websockets
max_connections 500

# Batas sederhana agar satu klien nakal tidak menghabiskan memori.
max_packet_size 65536
max_inflight_messages 20
max_queued_messages 200
