# TAHAP AWAL (sebelum ada sertifikat HTTPS). Ganti iot.contoh.my.id dengan domain Anda.
# Dipakai juga untuk mengambil sertifikat Let's Encrypt (folder /var/www/certbot).
# Setelah sertifikat terbit, ganti berkas ini dengan iot-platform.conf.

upstream iot_daphne {
    server 127.0.0.1:8001;   # Daphne (iot-web.service), hanya di localhost
}

server {
    listen 80;
    listen [::]:80;
    server_name iot.contoh.my.id;

    client_max_body_size 8m;                 # upload firmware (OTA_MAX_FIRMWARE_SIZE 4 MB)
    server_tokens off;                        # jangan pamerkan versi Nginx

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /static/ {
        alias /srv/iot/app/staticfiles/;
        expires 7d;
    }

    location /ws/ {
        proxy_pass http://iot_daphne;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://iot_daphne;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
