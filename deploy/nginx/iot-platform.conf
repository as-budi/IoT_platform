# Konfigurasi AKHIR (setelah sertifikat Let's Encrypt terbit). Ganti iot.contoh.my.id.
#
#   http://  (port 80)  -> halaman web dialihkan ke https://
#                          /api/ tetap dilayani untuk device yang belum memakai TLS
#                          (lihat "Risiko yang masih ada" di docs/deploy-lightsail.md)
#   https:// (port 443) -> semua

upstream iot_daphne {
    server 127.0.0.1:8001;
}

# Batas laju halaman akun: 10 per menit per alamat IP. Melawan tebak password
# (login) dan pemakaian server untuk mengirim email ke orang lain (sign up,
# kirim ulang aktivasi, lupa password).
limit_req_zone $binary_remote_addr zone=iot_login:10m rate=10r/m;
# Batas laju API device: 20 permintaan per detik per IP.
limit_req_zone $binary_remote_addr zone=iot_api:10m rate=20r/s;

# Permintaan dengan nama host lain (pemindai yang memakai IP langsung) ditolak.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name iot.contoh.my.id;
    server_tokens off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Device lama yang mengirim lewat http:// tetap diterima. Hapus blok ini
    # bila semua device sudah memakai https:// atau MQTT TLS.
    location /api/ {
        limit_req zone=iot_api burst=40 nodelay;
        client_max_body_size 64k;
        proxy_pass http://iot_daphne;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # Nginx 1.24 (Ubuntu 24.04) menulis http2 di baris listen; versi >= 1.25
    # memakai "http2 on;" (yang lama tetap jalan, hanya memberi peringatan).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name iot.contoh.my.id;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/iot.contoh.my.id/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iot.contoh.my.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Header keamanan untuk browser. (HSTS dikirim oleh Django, lihat DJANGO_HSTS_SECONDS.)
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    client_max_body_size 8m;

    location /static/ {
        alias /srv/iot/app/staticfiles/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ ^/accounts/(login|register|activate/resend|password/reset)/$ {
        limit_req zone=iot_login burst=5 nodelay;
        proxy_pass http://iot_daphne;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        limit_req zone=iot_api burst=40 nodelay;
        client_max_body_size 64k;
        proxy_pass http://iot_daphne;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ws/ {
        proxy_pass http://iot_daphne;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }

    location / {
        proxy_pass http://iot_daphne;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
