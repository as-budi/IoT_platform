{% extends "base.html" %}

{% block title %}Daftar · IoT Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Buat akun</h1>
        <p class="text-muted">Akun baru terdaftar sebagai User.</p>
        <form method="post">
          {% csrf_token %}
          {% include "includes/form_fields.html" %}
          <button type="submit" class="btn btn-primary w-100">Daftar</button>
        </form>
        <p class="text-center mt-3 mb-0">
          Sudah punya akun? <a href="{% url 'accounts:login' %}">Masuk</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
