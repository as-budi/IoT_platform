{% extends "base.html" %}

{% block title %}Sign up · IoT Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Create an account</h1>
        <p class="text-muted">New accounts are registered with the User role.</p>
        <form method="post">
          {% csrf_token %}
          {% include "includes/form_fields.html" %}
          <button type="submit" class="btn btn-primary w-100">Sign up</button>
        </form>
        <p class="text-center mt-3 mb-0">
          Already have an account? <a href="{% url 'accounts:login' %}">Log in</a>
        </p>
      </div>
    </div>
  </div>
</div>
{% endblock %}
