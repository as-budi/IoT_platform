{% extends "base.html" %}

{% block title %}Resend activation link · IoT Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-1">Resend activation link</h1>
        <p class="text-muted">Enter the email address you signed up with.</p>
        <form method="post">
          {% csrf_token %}
          {% include "includes/form_fields.html" %}
          <button type="submit" class="btn btn-primary w-100">Send link</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
