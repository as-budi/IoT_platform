{% extends "base.html" %}

{% block title %}Password changed · IoT Platform{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7 col-lg-5">
    <div class="card shadow-sm">
      <div class="card-body p-4">
        <h1 class="h4 mb-2">Password changed</h1>
        <p>Your password was changed. Any browser where you were logged in has been logged out.</p>
        <a class="btn btn-primary w-100" href="{% url 'accounts:login' %}">Log in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
